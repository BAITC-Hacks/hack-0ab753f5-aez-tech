<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1b2a">
  <title>{% block title %}Планирование закупок{% endblock %}</title>
  <style>
    :root {
      --navy: #0c1b2a; --navy-soft: #142b40; --blue: #1976a9; --blue-dark: #105b87;
      --ink: #192736; --muted: #617181; --line: #dfe7ee; --canvas: #f5f7fa;
      --panel: #ffffff; --green: #19734b; --green-bg: #eaf7ef; --amber: #a55b00;
      --amber-bg: #fff5e5; --red: #ae3636; --red-bg: #fff0f0; --radius: 12px;
      font-family: Inter, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    a { color: var(--blue-dark); }
    .site-header { min-height: 72px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; color: #fff; background: var(--navy); border-bottom: 1px solid #20394d; }
    .brand { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: #d8efff; background: #1c4b68; font-size: 12px; letter-spacing: .08em; font-weight: 800; }
    .brand-text { display: grid; gap: 2px; } .brand-title { font-size: 15px; font-weight: 720; letter-spacing: .01em; } .brand-subtitle { color: #9db3c4; font-size: 11px; }
    .header-nav, .user-menu { display: flex; align-items: center; gap: 18px; }
    .header-nav a, .user-menu a { color: #d5e1e9; font-size: 14px; font-weight: 600; text-decoration: none; }
    .header-nav a:hover, .user-menu a:hover, .header-nav a.active { color: #fff; }
    .header-nav a.active { padding-bottom: 5px; border-bottom: 2px solid #5bc0eb; }
    .user-chip { padding: 7px 10px; border: 1px solid #345069; border-radius: 7px; color: #dce7ee; font-size: 13px; }
    .header-button { color: #d5e1e9; background: transparent; border: 0; padding: 0; font: inherit; cursor: pointer; }
    main { max-width: 1440px; margin: 0 auto; padding: 32px 28px 64px; }
    .page-intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin-bottom: 8px; color: var(--blue-dark); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.035em; line-height: 1.15; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; } h3 { margin: 0; font-size: 14px; }
    p { line-height: 1.55; } .page-intro p { max-width: 760px; margin: 10px 0 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; } .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { margin-bottom: 20px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 8px 22px rgba(28, 49, 68, .035); }
    .card-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 17px; } .card-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .metric { min-height: 112px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: #fff; } .metric-label { color: var(--muted); font-size: 12px; font-weight: 650; } .metric-value { margin-top: 10px; font-size: 29px; font-weight: 750; letter-spacing: -.04em; } .metric-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    label { display: block; margin: 0 0 7px; color: #334454; font-size: 13px; font-weight: 700; }
    form p { margin: 0 0 14px; } form p:last-of-type { margin-bottom: 18px; }
    input, select, textarea { width: 100%; min-height: 40px; padding: 9px 11px; border: 1px solid #bfcbd5; border-radius: 7px; outline: none; color: var(--ink); background: #fff; font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #1b82bb1c; } input[type=checkbox] { width: 16px; min-height: 16px; accent-color: var(--blue); }
    .helptext, small { color: var(--muted); font-size: 12px; line-height: 1.45; }
    button, .button { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border: 1px solid var(--blue); border-radius: 7px; color: #fff; background: var(--blue); box-shadow: 0 1px 1px #0e38541f; text-decoration: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
    button:hover, .button:hover { border-color: var(--blue-dark); background: var(--blue-dark); } button:active, .button:active { transform: translateY(1px); }
    button.secondary, .button.secondary { color: #324a5c; border-color: #c5d1da; background: #fff; box-shadow: none; } button.secondary:hover, .button.secondary:hover { border-color: #96aabb; color: #102b3f; background: #f7fafc; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; } th, td { padding: 12px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; } th { color: #536576; background: #f7f9fb; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; } td { font-size: 13px; } tbody tr:last-child td { border-bottom: 0; } tbody tr:hover td { background: #fbfdff; } td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; } .scroll table { min-width: 700px; }
    .muted { color: var(--muted); } .good { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; line-height: 1.2; } .badge.good { color: var(--green); background: var(--green-bg); } .badge.warn { color: var(--amber); background: var(--amber-bg); } .badge.bad { color: var(--red); background: var(--red-bg); } .badge.neutral { color: #506170; background: #eef3f6; }
    .messages { display: grid; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; } .messages li { padding: 12px 14px; border: 1px solid #cfe0ee; border-radius: 8px; color: #174868; background: #edf7fe; font-size: 14px; } .messages li.error { border-color: #f1c8c8; color: #922b2b; background: var(--red-bg); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; } .toolbar form { margin: 0; } .toolbar-spacer { flex: 1; }
    .search { display: flex; gap: 8px; min-width: min(100%, 380px); } .search input { min-width: 190px; } .search button { flex: 0 0 auto; }
    .compact { display: grid; grid-template-columns: 92px minmax(145px, 1fr) auto; gap: 7px; min-width: 320px; } .compact input { min-width: 0; }
    details { margin-top: 9px; } summary { color: var(--blue-dark); font-size: 12px; font-weight: 700; cursor: pointer; } .table-subtext { display: block; max-width: 330px; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.38; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0 0; color: var(--muted); font-size: 13px; } .pager a { font-weight: 700; text-decoration: none; }
    .dashboard-controls form { display: flex; align-items: end; gap: 12px; } .dashboard-controls p, .dashboard-controls p:last-of-type { flex: 1; margin: 0; }
    .dashboard-controls button { min-width: 132px; min-height: 40px; color: #fff; border-color: #0d5f8f; background: #0d6f9f; box-shadow: 0 5px 13px rgba(14, 85, 125, .2); }
    .dashboard-controls button:hover { border-color: #084e75; background: #084e75; }
    .chart-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .9fr); gap: 20px; margin-bottom: 20px; }
    .chart-panel { min-height: 310px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 8px 22px rgba(28, 49, 68, .035); }
    .chart-panel h2 { margin-bottom: 5px; } .chart-panel p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .chart { width: 100%; min-height: 215px; } .chart svg { display: block; width: 100%; height: 225px; overflow: visible; }
    .bar-list { display: grid; gap: 14px; padding-top: 8px; } .bar-row { display: grid; grid-template-columns: minmax(95px, 1fr) 2.2fr auto; align-items: center; gap: 10px; font-size: 12px; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #405262; } .bar-track { height: 9px; overflow: hidden; border-radius: 99px; background: #eaf0f4; } .bar-fill { display: block; height: 100%; border-radius: inherit; background: var(--blue); } .bar-fill.critical { background: var(--red); } .bar-fill.warning { background: #e79b38; } .bar-fill.positive { background: var(--green); } .bar-fill.negative { background: #a65a5a; } .bar-value { min-width: 42px; text-align: right; color: #263a4b; font-variant-numeric: tabular-nums; font-weight: 700; }
    .order-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; } .order-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 8px 22px rgba(28, 49, 68, .035); }
    .order-card-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; } .order-card h2 { font-size: 18px; } .order-card p { margin: 5px 0 0; color: var(--muted); font-size: 13px; } .order-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 16px 0 19px; } .order-stat { padding: 11px; border-radius: 8px; background: #f6f9fb; } .order-stat span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; } .order-stat strong { display: block; margin-top: 4px; font-size: 19px; letter-spacing: -.03em; }
    .review-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } .review-stat { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: #f8fafc; } .review-stat span, .review-stat small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; } .review-stat strong { display: block; margin: 7px 0 4px; color: var(--ink); font-size: 23px; letter-spacing: -.04em; } .review-stat strong.bad { color: var(--red); } .review-stat strong.good { color: var(--green); }
    .data-note { padding: 13px 14px; border-left: 3px solid #d18b28; color: #684311; background: #fff8eb; font-size: 13px; line-height: 1.5; }
    .login-shell { max-width: 420px; margin: 9vh auto; } .login-brand { margin-bottom: 24px; color: var(--navy); text-align: center; } .login-brand .brand-mark { margin: 0 auto 13px; color: #eaf7ff; background: var(--navy-soft); } .login-brand h1 { font-size: 27px; } .login-brand p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    @media (max-width: 1080px) { .metric-grid, .review-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 820px) { .site-header { padding: 0 18px; } .header-nav { display: none; } main { padding: 25px 16px 44px; } .page-intro { align-items: start; flex-direction: column; } .grid, .grid-3, .metric-grid, .chart-grid, .review-grid { grid-template-columns: 1fr; } .dashboard-controls form { align-items: stretch; flex-direction: column; } .dashboard-controls button { width: 100%; } .compact { min-width: 290px; grid-template-columns: 80px 1fr; } .compact button { grid-column: span 2; } .search { width: 100%; } .search input { flex: 1; } }
  </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{% url 'home' %}">
    <span class="brand-mark">OP</span>
    <span class="brand-text"><span class="brand-title">Планирование закупок</span><span class="brand-subtitle">Контроль пополнения склада</span></span>
  </a>
  {% if user.is_authenticated %}
    <div class="header-nav"><a href="{% url 'home' %}" class="{% if nav_section == 'dashboard' %}active{% endif %}">Панель</a><a href="{% url 'orders' %}" class="{% if nav_section == 'orders' %}active{% endif %}">Заказы</a><a href="{% url 'data_status' %}" class="{% if nav_section == 'data' %}active{% endif %}">Данные</a><a href="/admin/">Настройки</a></div>
    <div class="user-menu"><span class="user-chip">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="header-button">Выйти</button></form></div>
  {% endif %}
</header>
<main>
{% if messages %}<ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
